<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mary Grace B. Montepalco | Cyber Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff007f;
            --pink-glow: rgba(255, 0, 127, 0.6);
            --card-bg: rgba(13, 17, 26, 0.92);
            --bg-color: #06080e;
            --text-white: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 2rem 1rem;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌸 FIT SA LEFT SIDE (PERFECT COVERAGE AT WALANG BAGO SA BACKGROUND FILE) 🌸 */
        .anime-bg-container {
            position: fixed;
            left: 0;
            bottom: 0;
            top: 0;
            width: 45vw;
            max-width: 600px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.75;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .anime-bg-img {
            height: 100vh;
            width: 100%;
            object-fit: cover;
            object-position: left center;
            filter: drop-shadow(0 0 25px #ff007f) drop-shadow(0 0 50px rgba(255, 0, 127, 0.85)) sepia(100%) hue-rotate(290deg) saturate(500%);
            animation: pinkPulse 3s infinite alternate;
        }

        @keyframes pinkPulse {
            0% {
                filter: drop-shadow(0 0 18px #ff007f) drop-shadow(0 0 35px rgba(255, 0, 127, 0.65)) sepia(100%) hue-rotate(290deg) saturate(450%);
            }
            100% {
                filter: drop-shadow(0 0 40px #ff007f) drop-shadow(0 0 80px rgba(255, 0, 127, 1)) sepia(100%) hue-rotate(290deg) saturate(650%);
            }
        }

        /* 🌟 TOP NAVIGATION BAR (KATULAD NG REFERENCE) 🌟 */
        nav {
            max-width: 1100px;
            margin: 0 auto 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            background: rgba(13, 17, 26, 0.9);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 40px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        /* Left Side: Instagram DP + Name + Subtitle */
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .nav-brand:hover {
            opacity: 0.85;
        }

        .nav-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--neon-pink);
            box-shadow: 0 0 12px var(--pink-glow);
        }

        .nav-brand-text {
            display: flex;
            flex-direction: column;
        }

        .nav-name {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-white);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-name i {
            font-size: 0.75rem;
            color: var(--neon-pink);
        }

        .nav-title-sub {
            font-size: 0.7rem;
            color: var(--neon-pink);
        }

        /* Right / Center Menu Links */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        /* Social Icons & Resume Button sa Navbar */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-social-icon {
            color: var(--text-sub);
            font-size: 1.1rem;
            text-decoration: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .nav-social-icon:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        /* White Pill-shaped Resume Button katulad ng sa reference */
        .btn-nav-resume {
            background-color: #ffffff;
            color: #0d1117;
            padding: 0.4rem 1.1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .btn-nav-resume:hover {
            background-color: var(--neon-pink);
            color: #ffffff;
            box-shadow: 0 0 20px var(--neon-pink);
            transform: translateY(-1px);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            position: relative;
            z-index: 10;
        }

        /* Neon Pink Card Style */
        .pink-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-pink);
            border-radius: 20px;
            padding: 2.8rem 2.2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.25), inset 0 0 15px rgba(255, 0, 127, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(12px);
            cursor: pointer;
        }

        .pink-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 35px var(--neon-pink), inset 0 0 25px rgba(255, 0, 127, 0.3);
        }

        /* 💧 WATER DROP RIPPLE ANIMATION 💧 */
        .hover-ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.7) 0%, rgba(255, 0, 127, 0) 70%);
            border: 1px solid var(--neon-pink);
            transform: scale(0);
            animation: waterDropRipple 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes waterDropRipple {
            0% {
                width: 0px;
                height: 0px;
                opacity: 1;
                transform: translate(-50%, -50%) scale(0);
            }
            100% {
                width: 380px;
                height: 380px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* HERO SECTION LAYOUT */
        .hero-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            min-height: 65vh;
        }

        .hero-left {
            flex: 1.2;
            min-width: 300px;
        }

        .tag-sub {
            color: var(--neon-pink);
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            text-shadow: 0 0 8px var(--neon-pink);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-pink);
            display: inline-block;
        }

        .hero-name {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 0.6rem;
            letter-spacing: -1px;
        }

        .hero-name span {
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
        }

        .hero-course {
            font-size: 1.25rem;
            color: #f8fafc;
            font-weight: 700;
            margin-bottom: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }

        .hero-about {
            color: var(--text-sub);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 1.8rem;
        }

        .btn-pink {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--neon-pink);
            color: #000;
            padding: 0.8rem 1.8rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 0 20px var(--neon-pink);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-pink:hover {
            box-shadow: 0 0 35px var(--neon-pink), 0 0 50px var(--neon-pink);
            transform: scale(1.03);
        }

        .btn-outline-pink {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 0.8rem 1.8rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            transition: all 0.3s ease;
        }

        .btn-outline-pink:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        /* Right Side Graphic Box */
        .side-box {
            flex: 0.8;
            background: rgba(6, 8, 14, 0.85);
            border: 1.5px solid var(--neon-pink);
            border-radius: 18px;
            padding: 2.2rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.15);
            min-width: 250px;
        }

        .avatar-circle {
            width: 125px;
            height: 125px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            border: 2px dashed var(--neon-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            animation: rotateBorder 12s linear infinite;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 💼 WORK HISTORY STYLES (KATULAD NG SAMPLE SA LARAWAN) 💼 */
        .timeline {
            position: relative;
            margin-top: 1.5rem;
            padding-left: 1.5rem;
            border-left: 2px solid rgba(255, 0, 127, 0.4);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -1.95rem;
            top: 0.3rem;
            width: 12px;
            height: 12px;
            background-color: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }

        .role-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .badge-current {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid #00e676;
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .company-name {
            font-size: 0.9rem;
            color: var(--neon-pink);
            font-weight: 600;
        }

        .timeline-meta {
            text-align: right;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .timeline-meta div {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.4rem;
        }

        .work-desc {
            list-style: none;
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .work-desc li {
            position: relative;
            padding-left: 1.2rem;
            color: var(--text-sub);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 0.4rem;
        }

        .work-desc li::before {
            content: "•";
            color: var(--neon-pink);
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        /* 🌸 SKILLS & TOOLS BADGES 🌸 */
        .skills-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin-top: 1.4rem;
        }

        .badge {
            background: #06080e;
            border: 1.5px solid var(--neon-pink);
