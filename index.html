<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mary Grace Montepalco | Neon Cyber Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(15, 23, 42, 0.75);
            --cyan-neon: #00f0ff;
            --magenta-neon: #ff007f;
            --purple-neon: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Matrix / Digital Background Canvas */
        #cyber-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.25;
        }

        /* Top Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--cyan-neon);
            text-shadow: 0 0 10px var(--cyan-neon);
            border-bottom: 2px solid var(--cyan-neon);
        }

        /* Sub-Header Banner */
        .hero-banner {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
        }

        .hero-banner h2 {
            font-size: 2.2rem;
            color: var(--cyan-neon);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px var(--cyan-neon), 0 0 40px rgba(0,240,255,0.4);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
