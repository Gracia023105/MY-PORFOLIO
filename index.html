<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mary Grace B. Montepalco | Cyber Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff007f;
            --pink-glow: rgba(255, 0, 127, 0.6);
            --card-bg: rgba(13, 17, 26, 0.88);
            --bg-color: #06080e;
            --text-white: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 2rem 1rem;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌸 MALAKING ANIME BACKGROUND CHARACTER NA FIT SA BUONG LEFT SIDE 🌸 */
        .anime-bg-container {
            position: fixed;
            left: 0;
            bottom: 0;
            top: 0;
            width: 48vw; /* Lumalaki depende sa laki ng screen */
            max-width: 650px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.6;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .anime-bg-img {
            height: 100vh; /* Sagad mula taas hanggang ibaba ng screen */
            width: 100%;
            object-fit: cover; /* Fit sa buong left side */
            object-position: left center;
            filter: drop-shadow(0 0 25px #ff007f) drop-shadow(0 0 50px rgba(255, 0, 127, 0.85)) sepia(100%) hue-rotate(290deg) saturate(500%);
            animation: pinkPulse 3s infinite alternate;
        }

        @keyframes pinkPulse {
            0% {
                filter: drop-shadow(0 0 20px #ff007f) drop-shadow(0 0 40px rgba(255, 0, 127, 0.7)) sepia(100%) hue-rotate(290deg) saturate(450%);
            }
            100% {
                filter: drop-shadow(0 0 40px #ff007f) drop-shadow(0 0 80px rgba(255, 0, 127, 1)) sepia(100%) hue-rotate(290deg) saturate(650%);
            }
        }

        /* Top Navigation Bar */
        nav {
            max-width: 1100px;
            margin: 0 auto 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(13, 17, 26, 0.9);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 40px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }
