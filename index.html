<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mary Grace B. Montepalco | Cyber Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ff007f;
            --pink-glow: rgba(255, 0, 127, 0.6);
            --card-bg: rgba(13, 17, 26, 0.88);
            --bg-color: #06080e;
            --text-white: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            padding: 2rem 1rem;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 🌸 ANIME BACKGROUND CHARACTER WITH NEON PINK SINAG 🌸 */
        .anime-bg-container {
            position: fixed;
            left: -20px;
            bottom: 0;
            top: 0;
            width: 420px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.55;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
        }

        .anime-bg-img {
            height: 92vh;
            max-width: 100%;
            object-fit: contain;
            object-position: left bottom;
            filter: drop-shadow(0 0 20px #ff007f) drop-shadow(0 0 45px rgba(255, 0, 127, 0.8)) sepia(100%) hue-rotate(290deg) saturate(500%);
            animation: pinkPulse 3s infinite alternate;
        }

        @keyframes pinkPulse {
            0% {
                filter: drop-shadow(0 0 15px #ff007f) drop-shadow(0 0 30px rgba(255, 0, 127, 0.6)) sepia(100%) hue-rotate(290deg) saturate(400%);
            }
            100% {
                filter: drop-shadow(0 0 30px #ff007f) drop-shadow(0 0 60px rgba(255, 0, 127, 0.9)) sepia(100%) hue-rotate(290deg) saturate(600%);
            }
        }

        /* Top Navigation Bar */
        nav {
            max-width: 1100px;
            margin: 0 auto 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(13, 17, 26, 0.9);
            border: 1px solid rgba(255, 0, 127, 0.4);
            border-radius: 40px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .brand-logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            position: relative;
            z-index: 10;
        }

        /* Neon Pink Card Style */
        .pink-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-pink);
            border-radius: 20px;
            padding: 2.8rem 2.2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.25), inset 0 0 15px rgba(255, 0, 127, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .pink-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 35px var(--neon-pink), inset 0 0 25px rgba(255, 0, 127, 0.3);
        }

            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.6) 0%, rgba(255, 0, 127, 0) 70%);
            border: 1px solid rgba(255, 0, 127, 0.8);
            transform: scale(0);
